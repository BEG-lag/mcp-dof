name: Live API check

# Detects changes in the SIDOF API before users do. Runs weekly and on demand;
# it is kept out of the main CI so pull requests never depend on a government server.
on:
  schedule:
    - cron: "17 15 * * 1" # Mondays 15:17 UTC (09:17 in Mexico City)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run --frozen pytest --live -m live -v
