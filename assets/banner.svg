<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">mcp-dof</title>
  <desc id="desc">An MCP server that turns Mexico's Diario Oficial de la Federación into tools for AI agents. The terminal shows real calls: list_edition for 2026-11-13 returns 66 notes in 2 editions, get_note 5803775 returns the FIX exchange rate of 18.6188 pesos, search_notes for hidrocarburos finds 32 notes in 44 days, and get_indicators returns the FIX, UDIS and TIIE.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#191d27" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#cfff45" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#cfff45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0c10" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .serif { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-style: italic; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      .line { opacity: 0; animation: rise 0.6s ease-out forwards; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.7s; }
      .d3 { animation-delay: 1.3s; } .d4 { animation-delay: 1.8s; }
      .d5 { animation-delay: 2.4s; } .d6 { animation-delay: 2.9s; }
      .d7 { animation-delay: 3.5s; } .d8 { animation-delay: 4.0s; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .line { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#0a0c10"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.7"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect y="250" width="1200" height="150" fill="url(#vignette)"/>

  <!-- Identity -->
  <g>
    <rect x="64" y="70" width="10" height="10" fill="#cfff45"/>
    <text x="86" y="80" class="mono" font-size="13" letter-spacing="3" fill="#969dab">MCP SERVER · PYTHON · FASTMCP</text>
    <text x="60" y="170" class="mono" font-size="78" font-weight="700" fill="#eceee6" letter-spacing="-1">mcp<tspan fill="#cfff45">-dof</tspan></text>
    <rect class="cursor" x="398" y="112" width="30" height="64" fill="#cfff45"/>
    <text x="64" y="228" class="serif" font-size="32" fill="#eceee6">el Diario Oficial de la Federación,</text>
    <text x="64" y="264" class="serif" font-size="32" fill="#eceee6">al alcance de tu agente.</text>
    <text x="64" y="318" class="sans" font-size="15" fill="#969dab">Editions · full text as Markdown · title search · FIX, UDIS and TIIE</text>
    <text x="64" y="344" class="mono" font-size="13" fill="#ffb648">uvx --from git+https://github.com/BEG-lag/mcp-dof mcp-dof</text>
  </g>

  <!-- Terminal with real tool calls -->
  <g transform="translate(652 58)">
    <rect width="488" height="286" rx="14" fill="#11141b" stroke="#191d27" stroke-width="1.5"/>
    <rect width="488" height="40" rx="14" fill="#191d27"/>
    <rect y="26" width="488" height="14" fill="#191d27"/>
    <circle cx="22" cy="20" r="5.5" fill="#ff5d47"/>
    <circle cx="40" cy="20" r="5.5" fill="#ffb648"/>
    <circle cx="58" cy="20" r="5.5" fill="#cfff45"/>
    <text x="468" y="25" text-anchor="end" class="mono" font-size="12" fill="#969dab">stdio · 5 tools</text>

    <g class="mono" font-size="13.5">
      <text class="line d1" x="22" y="74"><tspan fill="#cfff45">›</tspan> <tspan fill="#7fd8ff">list_edition</tspan><tspan fill="#eceee6">(date="2026-11-13")</tspan></text>
      <text class="line d2" x="38" y="96" fill="#969dab">66 notes · matutina + vespertina</text>
      <text class="line d3" x="22" y="130"><tspan fill="#cfff45">›</tspan> <tspan fill="#7fd8ff">get_note</tspan><tspan fill="#eceee6">(code=5803775)</tspan></text>
      <text class="line d4" x="38" y="152" fill="#969dab">Tipo de cambio … <tspan fill="#eceee6">$18.6188 M.N.</tspan></text>
      <text class="line d5" x="22" y="186"><tspan fill="#cfff45">›</tspan> <tspan fill="#7fd8ff">search_notes</tspan><tspan fill="#eceee6">(practice_area="hidrocarburos")</tspan></text>
      <text class="line d6" x="38" y="208" fill="#969dab">32 notes · 44 days scanned</text>
      <text class="line d7" x="22" y="242"><tspan fill="#cfff45">›</tspan> <tspan fill="#7fd8ff">get_indicators</tspan><tspan fill="#eceee6">(date="2026-11-17")</tspan></text>
      <text class="line d8" x="38" y="264" fill="#969dab">FIX <tspan fill="#eceee6">18.5525</tspan> · UDIS <tspan fill="#eceee6">8.913896</tspan> · TIIE 28 <tspan fill="#eceee6">6.5147%</tspan></text>
    </g>
  </g>

  <text x="1140" y="376" text-anchor="end" class="mono" font-size="11" fill="#969dab" opacity="0.8">real output · 2026-11-17 · unofficial, not legal advice</text>
</svg>
