[project]
name = "mcp-dof"
version = "0.1.0"
description = "MCP server for Mexico's Diario Oficial de la Federación (DOF): daily editions, full texts as Markdown, keyword search and financial indicators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamín Esponda García" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "dof",
    "diario-oficial",
    "mexico",
    "legaltech",
    "regtech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12",
    "markdownify>=1.1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/BEG-lag/mcp-dof"
Repository = "https://github.com/BEG-lag/mcp-dof"
Issues = "https://github.com/BEG-lag/mcp-dof/issues"
Author = "https://pivotek.mx"

[project.scripts]
mcp-dof = "mcp_dof.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dof"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: hits the real SIDOF API (opt in with --live or MCP_DOF_LIVE=1)",
]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]
